[project]
name = "real-time-violence-detection-cnn"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "imageio>=2.37.3",
    "jupyterlab>=4.5.7",
    "matplotlib>=3.10.9",
    "moviepy>=2.2.1",
    "numpy>=2.4.6",
    "opencv-python>=4.13.0.92",
    "pandas>=3.0.3",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "tensorflow>=2.21.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]
